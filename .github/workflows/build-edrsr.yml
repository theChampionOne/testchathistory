name: Build complete EDRSR 204-1 corpus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-edrsr.yml"
      - "scripts/build_edrsr.py"
      - "requirements.txt"
      - "triggers/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  ARTIFACT_NAME: edrsr-204-1-complete-2025-08-07_2026-08-06

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish starting run pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/edrsr-pointer
          mkdir -p /tmp/edrsr-pointer/latest
          cat > /tmp/edrsr-pointer/latest/run.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "source_sha": "${GITHUB_SHA}",
            "status": "running",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifact_name": "${ARTIFACT_NAME}"
          }
          EOF
          cd /tmp/edrsr-pointer
          git init
          git checkout --orphan edrsr-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest
          git commit -m "Start EDRSR corpus run ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:edrsr-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download official annual EDRSR archives
        run: |
          set -euo pipefail
          mkdir -p raw outputs
          curl --fail --location --retry 12 --retry-all-errors \
            --output raw/edrsr_data_2025.zip \
            "https://data.gov.ua/dataset/2a95ae17-ed46-42ae-ad66-dd9b7a727bb7/resource/9f19ad2b-000f-4176-b283-95e399ad8e5e/download/edrsr_data_2025.zip"
          curl --fail --location --retry 12 --retry-all-errors \
            --output raw/edrsr_data_2026.zip \
            "https://data.gov.ua/dataset/16ab7f06-7414-405f-8354-0a492475272d/resource/b1a4ac1c-b17a-4988-8e6d-dedae8b2dd63/download/edrsr_data_2026.zip"
          ls -lh raw
          unzip -tq raw/edrsr_data_2025.zip
          unzip -tq raw/edrsr_data_2026.zip

      - name: Build SQLite, CSV and compressed full-text corpus
        run: |
          python scripts/build_edrsr.py \
            --archives raw/edrsr_data_2025.zip raw/edrsr_data_2026.zip \
            --date-from 2025-08-07 \
            --date-to 2026-08-06 \
            --workers 12 \
            --limit 0 \
            --out outputs

      - name: Print summary
        if: always()
        run: |
          find outputs -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort || true
          cat outputs/summary.json 2>/dev/null || true

      - name: Upload corpus artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Publish final run pointer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/edrsr-results
          mkdir -p /tmp/edrsr-results/latest
          cat > /tmp/edrsr-results/latest/run.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "source_sha": "${GITHUB_SHA}",
            "status": "${JOB_STATUS}",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifact_name": "${ARTIFACT_NAME}"
          }
          EOF
          cp outputs/summary.json /tmp/edrsr-results/latest/summary.json 2>/dev/null || true
          cp outputs/archive_report.json /tmp/edrsr-results/latest/archive_report.json 2>/dev/null || true
          cp outputs/fetch_errors.csv /tmp/edrsr-results/latest/fetch_errors.csv 2>/dev/null || true
          cd /tmp/edrsr-results
          git init
          git checkout --orphan edrsr-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest
          git commit -m "Publish EDRSR corpus run ${GITHUB_RUN_ID} (${JOB_STATUS})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:edrsr-results
